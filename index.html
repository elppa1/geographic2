<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>elppa-geographic</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      (() => {
        // The module request above is discovered first so TTC preloading cannot
        // delay the critical application/map bundle. This still starts before
        // deferred module execution and while the intro panel is on screen.
        const endpoint =
          '/api/geographic/toronto/ttc/live/vehicles'

        window.__TG_TTC_EARLY_VEHICLES__ = {
          startedAt:
            Date.now(),
          promise:
            fetch(
              endpoint,
              {
                cache:
                  'no-store',
                credentials:
                  'same-origin',
              }
            )
              .then(
                async (
                  response
                ) => {
                  if (
                    !response.ok
                  ) {
                    return null
                  }

                  return response.json()
                }
              )
              .catch(
                () =>
                  null
              ),
        }
      })()
    </script>
  </body>
</html>
